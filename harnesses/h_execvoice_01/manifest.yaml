  - version: v1.2
    date: 2026-09-01
    reprocessing_required: true
    affected_topics: [data_analytics_ai, digital_transformation_process,
                      systems_integration, transportation_fleet_systems]
    summary: >
      THE SHARED ATTRIBUTION FIX. `harnesses/h_execvoice_01/quotes.py` scored
      name-then-verb attribution FOLLOWING a quote -- `"...," Broderick said.` -- as
      `proximity` rather than `explicit`. It is the commonest attribution shape in American
      journalism. `explicit_after` matched only verb-then-name ("said Broderick"), and
      `explicit_before` matched name-then-verb but is anchored to the text PRECEDING the
      quote, so nothing matched the ordinary case.

      Two consequences, and the second is a correctness error rather than lost yield.
      An article whose only quote is attributed that way routed to ST-PRESSPROFILE and
      produced nothing. And at an EPONYMOUS firm -- McGough, Gilbane, Mack -- convention
      31's corollary rejects a `proximity` quote outright, so a genuinely and explicitly
      attributed quote was thrown away entirely.

      THE GUARD THAT MAKES THE FIX SAFE. Accepting name-then-verb naively would accept
      `"...," McGough Construction said.` as the PERSON speaking when it is the company.
      That would trade the error convention 31's corollary exists to catch for the one this
      fix removes. `_explicit_following` refuses the match where the text between the
      surname and the verb carries another token of the company name. Verified separable:

          "...," McGough said.               -> explicit   (was: thrown away)
          "...," McGough Construction said.  -> REJECTED   (unchanged)
          bare proximity at an eponymous firm -> REJECTED  (unchanged)

      SCOPE: attribution classification only. No admission threshold, theme matching or
      identity rule was touched, so the re-audit measures one change.

      ROW DELTA: 8 observations before, 8 after. Exactly ONE changed --
      Suffolk Construction (A043), confidence 0.65 -> 0.85, a quote moving from
      `proximity` to `explicit`. No row was added, removed or re-themed.

      reprocessing_required is TRUE because `confidence_0_1` is derived from attribution
      and therefore differs between versions for that row; a trend query spanning v1.1 and
      v1.2 would compare two different scales. The rows were removed and rewritten via
      delete_observations(keep_reviewed=True) rather than reconciled, because a corrected
      run does not propose rows it no longer believes and reconciliation alone would leave
      a stale row in place. None of the 8 was human-reviewed, so no review was at risk --
      but note the side effect: a delete-and-rewrite RENUMBERS observation_ids
      (O00277-O00284 became O00368-O00375). Acceptable here precisely because none carried
      human provenance; it would not be on a reviewed set.

      A REGRESSION THIS DOES NOT FIX, LOGGED RATHER THAN BUNDLED: proximity attribution
      still ignores an intervening explicit attribution to someone else, so an executive
      named earlier in a page can pick up a later quote the article attributes to a
      different speaker. Verified identical before and after this fix by running HEAD's
      quotes.py against the same fixture, so it is pre-existing and out of scope. See
      test_name_then_verb_does_not_upgrade_a_third_party_quote.

  - version: v1.0
    date: 2026-08-31
    reprocessing_required: false
    summary: >
      First build, and the projects first `buyer_articulates` instrument. Depends on
      H-EXECID-01 for the executive roster. Searches for each companys top two
      primary-relevance executives by name, fetches third-party pages, and records an
      observation only where a directly quoted passage is attributable to that named
      executive AND mentions a modernization theme. Quotes are interpreted onto
      organizational_state from explicit cues, and the matched cue is written into the
      observation so a Week 4 reviewer can disagree with the reading without re-fetching.
    notes: >
      Two design decisions worth recording.

      (1) BUYER-VOICE PATTERNS. `core/topics.py` documents that its patterns are
      provider-side phrasing and that buyer-side patterns belong per-harness. Testing made
      the reason concrete: the most valuable thing an operator says -- "we were still
      running our distribution centers on spreadsheets, and that does not scale" --
      matches nothing in the seller vocabulary, because vendors write "digital
      transformation" where operators write "spreadsheets". The two sides of the market
      describe the same condition with no shared token. `quotes.BUYER_VOICE_PATTERNS`
      supplies the buyer half, resolving into the SAME theme keys so the spine is not
      forked. Three patterns were removed during review for being loose enough to risk a
      fifth instance of convention 16.

      (2) GRADE B, NOT A. The taxonomy allows family 15 an A ceiling, but that A belongs
      to content an executive authored directly -- a LinkedIn post under their own name --
      which this harness cannot reach, because LinkedIn serves a bot wall to an
      unauthenticated fetch. Everything reachable here is journalist- or
      conference-mediated: genuinely said, but selected and framed by someone else. Taking
      the A because the family permits it would overstate the exact evidence the Week 3-4
      convergence analysis leans on hardest.
    known_limitations: >
      Low yield is expected and is not a defect: signal_taxonomy.md marks podcast
      appearances "don't-build" for this population because mid-size private industrial
      executives rarely speak publicly. `absent_confirmed` is the correct and common
      outcome -- the harness searched by name, reached readable third-party pages, and
      found no attributable quote. Companies where H-EXECID-01 identified no executive are
      recorded `not_covered` with the dependency named, so the prerequisite gap is visible
      in coverage math rather than hidden inside this harnesss numbers.

      LinkedIn (taxonomy 15a, the highest-reliability source in the entire taxonomy) is
      unreachable without authentication and is not attempted.

      Video and podcast audio are not transcribed; only written coverage is read. Taxonomy
      15c notes this is a different technology stack.

      publication_date is left empty. Third-party article dates are inconsistently marked
      up and guessing one would violate convention 3, which requires anything stated in an
      observation to come from the source snapshot rather than inference.

  - version: v1.1
    date: 2026-08-31
    reprocessing_required: true
    affected_topics: [all]
    summary: >
      Two attribution defects found by auditing the ten rows v1.0 committed, rather than
      by trusting the count.

      (1) EPONYMOUS SURNAMES. A quote was attributed to Tom McGough of McGough
      Construction off a page about a different person entirely, because "McGough" appears
      nearby as the COMPANY name and surname proximity cannot tell the two apart.
      Eponymous firms are everywhere in construction and trucking, so this is not an edge
      case. Where the executive surname is also a company-name token, only explicit
      attribution now counts.

      (2) VENDOR DIRECTORY PAGES. A CIO Review vendor profile
      (logistics.cioreview.com/vendor/2015/ct_logistics) produced a buyer_articulates row
      for CT Logistics. `/vendor/` was missing from the family-6 URL exclusions, so the
      exact trap session2_priority_order.md names was left half-closed.
    notes: >
      Marked reprocessing_required because both defects produce rows that are wrong about
      WHO said something, not merely imprecise. Prior rows were deleted rather than
      reconciled, since a corrected run does not propose them and reconciliation alone
      would leave them in place.
