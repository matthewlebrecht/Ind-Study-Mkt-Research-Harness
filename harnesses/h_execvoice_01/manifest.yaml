harness_id: H-EXECVOICE-01
module: h_execvoice_01
name: Executive Candor Extractor
current_version: v1.7
grandfathered_name: false

signal_types: [executive_public_statement]
declared_evidence_families: [15_executive_candor_actor_networks]

sources:
  - id: SRC-0040
    role: resolution_only
    notes: >
      Brave Search API. Used only to locate third-party pages that may quote a named
      executive; never cited. The claim is always made against the fetched page.
  - id: SRC-0033
    role: primary
    notes: >
      Conference talk and interview coverage. In practice this version reads the written
      coverage of such appearances rather than video, since transcript work is a different
      technology stack (taxonomy 15c).
  - id: SRC-0034
    role: supporting
    notes: >
      Podcast appearances. Kept in scope because they surface through the same search, but
      the taxonomy marks 15b "don't-build (yield too low for this population)" and the run
      results are expected to bear that out rather than contradict it.

