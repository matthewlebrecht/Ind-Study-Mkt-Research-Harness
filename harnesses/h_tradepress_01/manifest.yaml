harness_id: H-TRADEPRESS-01
module: h_tradepress_01
name: Vertical Trade Press Extractor
current_version: v1.7
grandfathered_name: false

signal_types:
  - exec_quote_reported
  - exec_contributed_column
  - exec_panel_coverage
  - trade_press_profile
  - trade_press_characterization
  - wire_reprint_routed

declared_evidence_families:
  - 15_executive_candor_actor_networks
  - 1_first_party_strategy_governance

sources:
  - id: SRC-0042
    role: primary
    notes: >
      Industry Dive vertical titles (Construction Dive, Supply Chain Dive, Food Dive,
      MedTech Dive, Utility Dive). Reported trade journalism carrying attributable
      executive quotes. Shared platform, URL shape and robots policy, so the titles
      succeed and fail together.
  - id: SRC-0043
    role: primary
    notes: >
      Trucking and freight trade press (Transport Topics, FleetOwner, CCJ, Overdrive,
      Truckinginfo, FreightWaves). The Industry Dive network covers this half of the
      universe less densely.
  - id: SRC-0029
    role: supporting
    notes: >
      The pre-existing generic "Trade publications" row. Retained as supporting so the
      lineage from the original taxonomy entry is visible; the two specific rows above are
      what this harness actually reads.
  - id: SRC-0040
    role: resolution_only
    notes: >
      Brave Search API, used to locate candidate articles within the outlet allowlist.
      Never cited in an Observation -- the row always cites the article the result points
      to. `site:` is not used because Brave's index does not honour it reliably across
      these hosts, so results are filtered against the allowlist after the fact and every
      off-list result is logged as excluded rather than silently dropped.

