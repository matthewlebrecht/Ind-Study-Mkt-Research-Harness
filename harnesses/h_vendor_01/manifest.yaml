harness_id: H-VENDOR-01
module: h_vendor_01
name: Vendor & Partner Disclosure Reader
current_version: v1.2
grandfathered_name: false

signal_types: [vendor_case_study_deployment_fact, vendor_case_study_buyer_quote]
declared_evidence_families: [6_vendor_partner_disclosure]

sources:
  - id: SRC-0018
    role: primary
    notes: >
      Vendor-published customer pages (case studies, customer stories, testimonials) that
      name a buyer company. Not searched for: the seed list is the set of URLs
      H-EXECVOICE-01 excluded as vendor_customer_content_family_6 while looking for
      executive quotes, read from its run logs. Undated and silently revised, so
      current_only reach (taxonomy §21.2). IC1 throughout (§24.3): the vendor is the
      interested party. ST-VENDORFRAMING (the vendor's own framing of demand) is counted
      per page and NOT written, because Observations keys company_id to Companies and the
      vendor is not a company in the sheet.

versions:
  - version: v1.2
    date: 2026-09-13
    reprocessing_required: false
    summary: >
      Session 17 wrap-up, Matthew's design for the SpawGlass question left open by v1.1. A
      deployment sentence that does not name the company is attributed to it only when (a)
      the page title (title tag, og:title or first h1) names the company, and (b) the
      sentence comes from the page body with nav, header, footer and aside blocks removed.
      Chrome is now removed before every sentence scan, named or not. An attributed row says
      so in its text and excerpt ("[page-subject attribution: ...]") and carries confidence
      0.4; generic-tier themes still write at low grade. Measured on the Ardoq / SpawGlass
      page before building: every theme-laden marketing line sits inside header/nav, the
      customer story inside main/article. Tests: core/tests/test_vendor.py section 4.
  - version: v1.1
    date: 2026-09-13
    reprocessing_required: false
    summary: >
      Week 4 (session 17). v1.0's population-0 result was checked page by page against the
      archived HTML before being written up as an absence, and it was not one. Of the six
      pages v1.0 read and called absent: two (SpawGlass, Melaleuca) were never matched in
      prose because the sentence test demanded the full canonical string for a one-token
      name; one (Autodesk's GRAHAM story) is a UK and Ireland contractor, not Graham
      Construction of Omaha; one (Autodesk's PENTA story) serves only its header, the body
      loading client-side; one is a University of Michigan dyslexia-help page, not vendor
      content; one (Joeris / OpenSpace) is a genuine read with no theme. Fixes: a coined
      one-token name stands alone in a sentence (convention 31); a one-distinctive-token
      company on a third-party page needs a corroborator (website domain, HQ city or HQ state
      name) or is refused as identity_uncorroborated; a page that passes identity but serves
      no prose naming the company is not_covered / js_rendered_unreachable, never absent;
      .edu / .gov hosts and business directories are not vendor content; seed dedupe ignores
      a leading www. Seeds: 28 distinct (company, url) pairs across 20 companies from every
      EXECVOICE run log (v1.0 saw 24). Tests: core/tests/test_vendor.py.
  - version: v1.0
    date: 2026-09-06
    reprocessing_required: false
    summary: >
      First build (session 14 item 4), around the 24 vendor URLs H-EXECVOICE-01 logged.
      Two written components per §24.1: ST-VENDORDEPLOY (buyer_acts, grade B, a sentence
      naming the company with a deployment verb and a spine theme) and ST-VENDORQUOTE
      (buyer_articulates, grade C -- capped one step below a reported executive quote --
      a quoted passage attributed to a named person with a title whose attribution ties
      them to the company; anonymous attributions counted and dropped per §24.2). Identity
      gate is H-FIRSTPARTY-01's is_about_company on the fetched page; appsruntheworld.com
      seeds are excluded as executive-data aggregator profiles, not vendor content;
      provider-published seeds are H-SELLERCONTENT-01 material and are not read. Generic-tier
      themes write at low grade with the standard marker. robots.txt honoured per host.
      Not a theme instrument in core/composition.py: its silence licenses nothing.
